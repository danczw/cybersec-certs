<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetOps Command — Network+ Training</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <h1 class="logo" onclick="window.location.hash='#/home'">NetOps<span class="accent">Command</span></h1>
      </div>
      <div class="header-right">
        <div class="stat-pill" id="xp-display">
          <span class="stat-label">XP</span>
          <span class="stat-value" id="xp-value">0</span>
        </div>
        <div class="stat-pill" id="level-display">
          <span class="stat-label">LVL</span>
          <span class="stat-value" id="level-value">1</span>
        </div>
        <div class="stat-pill" id="streak-display">
          <span class="stat-label">STREAK</span>
          <span class="stat-value" id="streak-value">0</span>
        </div>
      </div>
    </header>

    <main id="main-content">
      <!-- Content injected by router -->
    </main>
  </div>

  <div id="particle-container"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
